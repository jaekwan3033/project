<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>React Study2:Props</title>
</head>
<body>
    <div id="root"></div>
</body>
<script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

<script type="text/babel">
    {/*Prop from Btn from App function*/}
    function Btn({ text, changeValue, fontSize=8 }){
        console.log(text,"was rendered");
        return (
            <button 
                onClick = {changeValue}
                style={{
                    backgroundColor : "tomato",
                    color:"white",
                    padding:"10px 20px",
                    borderRadius:10,
                    border: 0,
                    fontSize,
                }}>
            {text}
            </button>
        );
    }

    /*Memorized btn*/
    const MemorizedBtn = React.memo(Btn);

    function App (){ 
        const [value, setValue] = React.useState("Save Changes");
        const changeValue = () => {
            setValue("Revert Changes")
        };
            return (
            <div>
                {/*Btn is not a HTML element, but a custom function created.
                Therefore, onClick below is not an event listener. 
                It is a prop that we send to the function*/}
                <MemorizedBtn text={value} changeValue={changeValue} fontSize={36}/>
                <MemorizedBtn text={value}/>
            </div>
            );
        }
    const root =document.getElementById("root");
    ReactDOM.render(<App />,root);
</script>
</html>
